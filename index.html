<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Life Growth</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #10141b;
        color: #f5f5f5;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
    }

    header {
        text-align: center;
        margin-bottom: 20px;
    }

    header h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: 1px;
    }

    header p {
        margin: 8px 0 0;
        color: #aeb7c4;
        font-size: 15px;
    }

    /* CHILD SELECTOR */

    .child-selector {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .child-button {
        flex: 1;
        padding: 15px;
        border: 2px solid #303846;
        border-radius: 12px;
        background: #191f29;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    .child-button.active {
        border-color: #e0b84f;
        background: #252c38;
    }

    /* OVERALL LEVEL */

    .profile-card {
        background: #191f29;
        border: 1px solid #303846;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 24px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .profile-name {
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .overall-level {
        font-size: 20px;
        color: #e0b84f;
        font-weight: bold;
        margin-bottom: 18px;
    }

    .xp-text {
        display: flex;
        justify-content: space-between;
        color: #b9c1cc;
        font-size: 13px;
        margin-bottom: 7px;
    }

    /* PROGRESS BARS */

    .progress-background {
        width: 100%;
        height: 16px;
        background: #0d1015;
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid #353d49;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #c99425, #f1d36b);
        border-radius: 999px;
        transition: width 0.5s ease;
    }

    /* SKILLS */

    .skills-title {
        font-size: 24px;
        margin-bottom: 12px;
    }

    .skills-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .skill-card {
        background: #191f29;
        border: 1px solid #303846;
        border-radius: 14px;
        padding: 16px;
    }

    .skill-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
    }

    .skill-name {
        font-size: 16px;
        font-weight: bold;
    }

    .skill-level {
        color: #e0b84f;
        font-size: 14px;
        font-weight: bold;
        white-space: nowrap;
    }

    .skill-xp {
        margin-top: 7px;
        color: #8993a2;
        font-size: 12px;
        display: flex;
        justify-content: space-between;
    }

    .skill-card .progress-background {
        height: 11px;
    }

    .footer {
        text-align: center;
        color: #697383;
        font-size: 12px;
        margin: 30px 0 10px;
    }

    @media (max-width: 650px) {
        .container {
            padding: 14px;
        }

        header h1 {
            font-size: 27px;
        }

        .profile-name {
            font-size: 26px;
        }

        .skills-grid {
            grid-template-columns: 1fr;
        }

        .skill-card {
            padding: 15px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <header>
        <h1>🌱 REAL LIFE GROWTH</h1>
        <p>This is who you're growing to become.</p>
    </header>

    <!-- CHILD SELECTOR -->
    <div class="child-selector">
        <button class="child-button active" onclick="selectChild('JD')" id="button-JD">
            JD
        </button>

        <button class="child-button" onclick="selectChild('Michael')" id="button-Michael">
            Michael
        </button>
    </div>

    <!-- PROFILE -->
    <div class="profile-card">

        <div class="profile-name" id="childName">
            JD
        </div>

        <div class="overall-level" id="overallLevel">
            LEVEL 1
        </div>

        <div class="xp-text">
            <span id="overallCurrentXP">0 XP</span>
            <span id="overallNextXP">83 XP</span>
        </div>

        <div class="progress-background">
            <div class="progress-fill" id="overallProgress"></div>
        </div>

    </div>

    <!-- SKILLS -->
    <div class="skills-title">
        Skills
    </div>

    <div class="skills-grid" id="skillsGrid"></div>

    <div class="footer">
        Growth is not about being better than someone else.<br>
        It's about becoming who you're capable of becoming.
    </div>

</div>

<script>

/* =========================================================
   SKILLS
   ========================================================= */

const skills = [
    { name: "⚾ Baseball" },
    { name: "🏀 Basketball" },
    { name: "🏈 Football" },
    { name: "⛳ Golf" },
    { name: "🏊 Swimming" },

    { name: "📚 Reading" },
    { name: "✍️ Writing" },
    { name: "🔢 Mathematics" },

    { name: "🎨 Drawing" },
    { name: "🧱 Building" },
    { name: "🎨 Designing" },

    { name: "🙏 God Relationship" },
    { name: "❤️ Family Relationship" },
    { name: "🤝 Friend Relationships" },

    { name: "💡 Creativity" },
    { name: "🍳 Cooking" },
    { name: "🧹 Responsibility" },

    { name: "🏃 Running / Speed" },
    { name: "💪 Strength" },

    { name: "♟️ Chess" },
    { name: "🧠 Critical Thinking" },
    { name: "🎵 Music" }
];


/* =========================================================
   PLAYER DATA
   ========================================================= */

const players = {

    JD: {
        xp: {},
    },

    Michael: {
        xp: {},
    }

};


/* =========================================================
   START EVERY SKILL AT ZERO XP
   ========================================================= */

function initializePlayers() {

    Object.keys(players).forEach(player => {

        skills.forEach(skill => {

            if (players[player].xp[skill.name] === undefined) {
                players[player].xp[skill.name] = 0;
            }

        });

    });

}

initializePlayers();


/* =========================================================
   RUNESCAPE-INSPIRED XP TABLE
   =========================================================
   
   Each level requires progressively more XP.

   We use the classic RuneScape-style idea:
   higher levels require increasingly more experience.

   This function returns TOTAL XP required to reach a level.
   ========================================================= */

function xpForLevel(level) {

    if (level <= 1) {
        return 0;
    }

    let total = 0;

    for (let i = 1; i < level; i++) {

        total += Math.floor(
            i + 300 * Math.pow(2, i / 7)
        );

    }

    return Math.floor(total / 4);
}


/* =========================================================
   DETERMINE LEVEL FROM TOTAL XP
   ========================================================= */

function getLevel(xp) {

    let level = 1;

    while (xp >= xpForLevel(level + 1)) {
        level++;

        if (level >= 99) {
            return 99;
        }
    }

    return level;
}


/* =========================================================
   PROGRESS TOWARD NEXT LEVEL
   ========================================================= */

function getProgress(xp) {

    const level = getLevel(xp);

    if (level >= 99) {
        return 100;
    }

    const currentLevelXP = xpForLevel(level);
    const nextLevelXP = xpForLevel(level + 1);

    const progress =
        ((xp - currentLevelXP) /
        (nextLevelXP - currentLevelXP)) * 100;

    return Math.max(0, Math.min(100, progress));
}


/* =========================================================
   CURRENT CHILD
   ========================================================= */

let currentChild = "JD";


/* =========================================================
   SELECT CHILD
   ========================================================= */

function selectChild(child) {

    currentChild = child;

    document
        .querySelectorAll(".child-button")
        .forEach(button => button.classList.remove("active"));

    document
        .getElementById("button-" + child)
        .classList.add("active");

    render();

}


/* =========================================================
   CALCULATE OVERALL XP
   ========================================================= */

function getOverallXP(player) {

    let total = 0;

    skills.forEach(skill => {
        total += player.xp[skill.name];
    });

    return total;

}


/* =========================================================
   RENDER EVERYTHING
   ========================================================= */

function render() {

    const player = players[currentChild];

    document.getElementById("childName").textContent =
        currentChild;


    /* ---------------------------------------------
       OVERALL LEVEL
       --------------------------------------------- */

    const overallXP = getOverallXP(player);

    const overallLevel = getLevel(overallXP);

    const overallProgress = getProgress(overallXP);

    document.getElementById("overallLevel").textContent =
        "LEVEL " + overallLevel;

    document.getElementById("overallCurrentXP").textContent =
        overallXP.toLocaleString() + " XP";

    if (overallLevel >= 99) {

        document.getElementById("overallNextXP").textContent =
            "MAX LEVEL";

    } else {

        document.getElementById("overallNextXP").textContent =
            xpForLevel(overallLevel + 1).toLocaleString() +
            " XP";

    }

    document.getElementById("overallProgress").style.width =
        overallProgress + "%";


    /* ---------------------------------------------
       SKILLS
       --------------------------------------------- */

    const grid = document.getElementById("skillsGrid");

    grid.innerHTML = "";


    skills.forEach(skill => {

        const xp = player.xp[skill.name];

        const level = getLevel(xp);

        const progress = getProgress(xp);

        const card = document.createElement("div");

        card.className = "skill-card";

        card.innerHTML = `

            <div class="skill-header">

                <div class="skill-name">
                    ${skill.name}
                </div>

                <div class="skill-level">
                    LV ${level}
                </div>

            </div>

            <div class="progress-background">

                <div
                    class="progress-fill"
                    style="width: ${progress}%">
                </div>

            </div>

            <div class="skill-xp">

                <span>
                    ${xp.toLocaleString()} XP
                </span>

                <span>
                    ${
                        level >= 99
                        ? "MAX"
                        : xpForLevel(level + 1).toLocaleString()
                    }
                </span>

            </div>

        `;

        grid.appendChild(card);

    });

}


/* =========================================================
   INITIAL DISPLAY
   ========================================================= */

render();

</script>

</body>
</html>
